name: CI/CD Deploy to Private Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: divineitstudio/trada-backend

jobs:
  # ========================================================
  # 1. BUILD & PUSH IMAGE TO GITHUB CONTAINER REGISTRY (GHCR)
  # ========================================================
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 2. DEPLOY TO PRIVATE SERVER (SELF-HOSTED RUNNER)
  # ========================================================
  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR on Server (Optional if package is private)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | /usr/bin/docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

      - name: Pull and Restart Docker Container
        run: |
          cd /opt/trada
          /usr/bin/docker compose pull
          /usr/bin/docker compose up -d --remove-orphans
          /usr/bin/docker system prune -f
